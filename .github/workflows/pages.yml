name: Deploy GitHub Pages

# Static build of Microbiome Kitchen for https://dust2ash7.github.io/Microbiome-Kitchen/.
# Recipes and the grocery list live in the browser, so the prerendered client
# build is the whole app. server/ and migrations/ are only used by the
# hosted Grok/Vercel build, not by Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Build static site under /Microbiome-Kitchen/
        run: npm run build:pages

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
